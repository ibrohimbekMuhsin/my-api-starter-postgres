api_platform:
    title: 'Attendance New API'
    version: 1.0.0

    # Отключаем только UI документации (Swagger UI, ReDoc)
    enable_swagger_ui: false
    enable_re_doc: false
    show_webby: false

    # Только JSON форматы для production (без HTML, чтобы не показывалась главная страница)
    formats:
        jsonld:
            mime_types: [ 'application/ld+json' ]
        json:
            mime_types: [ 'application/json' ]
        multipart:
            mime_types: [ 'multipart/form-data' ]

    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
            max_age: 3600 # 1 час для клиента
            shared_max_age: 3600 # 1 час для прокси/CDN
            public: true

    use_symfony_listeners: true

    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header