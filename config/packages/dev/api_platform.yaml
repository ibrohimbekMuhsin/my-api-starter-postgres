api_platform:
    title: 'Attendance New API'
    version: 1.0.0

    # Включаем всю документацию для разработки
    enable_docs: true
    enable_swagger_ui: true
    enable_re_doc: true
    enable_entrypoint: true
    show_webby: true

    formats:
        jsonld:
            mime_types: [ 'application/ld+json' ]
        json:
            mime_types: [ 'application/json' ]
        html:
            mime_types: [ 'text/html' ]
        multipart:
            mime_types: [ 'multipart/form-data' ]

    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
            max_age: 0
            shared_max_age: 0
            public: false
        extra_properties:
            cache_headers:
                'Cache-Control': 'no-store, no-cache, must-revalidate, max-age=0'
                'Pragma': 'no-cache'
                'Expires': '0'

    use_symfony_listeners: true

    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
        swagger_ui_extra_configuration:
            persistAuthorization: true
